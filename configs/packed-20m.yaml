# Tuned packed-4 recipe; see doc/recipe_sweep_packed4_20m_128k.md.
# Defaults supply the ordinary 20M model and runtime settings.
data:
  revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
  tokenizer_revision: 59f6f375b26bde864a6ca194a9a3044570490064
decentralized:
  num_models: 4
  topology: one_peer_exponential
training:
