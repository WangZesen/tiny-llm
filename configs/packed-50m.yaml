# Defaults supply the C4 cache, AdamW, and runtime settings.
model:
  layers: 10
  width: 512
  heads: 8
  ffn_width: 1408
decentralized:
  num_models: 4
  topology: one_peer_exponential
training:
  batch_tokens: 32768
  micro_batch_size: 8
  # Explicit equal-worker boundaries, divisible by 8 * context_length as well.
  epoch_tokens: 24256512
  # Round the ordinary total budget down to 8 * context_length; final epoch is shorter.
  max_tokens: 970145792
runtime:
  output_dir: runs/packed-50m
