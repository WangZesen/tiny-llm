[project]
name = "tiny-llm"
version = "0.1.0"
description = "Small Llama pretraining on C4 with inspectable, twice-differentiable models"
readme = "README.md"
authors = [
    { name = "Zesen", email = "zesen@kth.se" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.30.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[project.scripts]
tiny-llm = "tiny_llm:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a CUDA GPU"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
